name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose plan only or plan and apply"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.repository }}-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Format, validate, and plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_deployment_role_arn: ""
      TF_VAR_environment: ${{ secrets.TF_ENVIRONMENT }}
      TF_VAR_name_prefix: ${{ secrets.TF_NAME_PREFIX }}
      TF_VAR_frontend_bucket_name: ${{ secrets.FRONTEND_BUCKET_NAME }}
      TF_VAR_lambda_artifact_bucket_name: ${{ secrets.LAMBDA_ARTIFACT_BUCKET_NAME }}
      TF_VAR_timezone: ${{ secrets.TF_TIMEZONE }}
      TF_VAR_log_retention_days: ${{ secrets.TF_LOG_RETENTION_DAYS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform with S3 state and native lock file
        working-directory: terraform/environments/dev
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=${TF_VAR_aws_account_id}/${TF_VAR_environment}/terraform.tfstate"
          -backend-config="region=${TF_VAR_aws_region}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - name: Validate Terraform
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Create saved Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Upload saved plan for optional apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform/environments/dev/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply reviewed plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_deployment_role_arn: ""
      TF_VAR_environment: ${{ secrets.TF_ENVIRONMENT }}
      TF_VAR_name_prefix: ${{ secrets.TF_NAME_PREFIX }}
      TF_VAR_frontend_bucket_name: ${{ secrets.FRONTEND_BUCKET_NAME }}
      TF_VAR_lambda_artifact_bucket_name: ${{ secrets.LAMBDA_ARTIFACT_BUCKET_NAME }}
      TF_VAR_timezone: ${{ secrets.TF_TIMEZONE }}
      TF_VAR_log_retention_days: ${{ secrets.TF_LOG_RETENTION_DAYS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Initialize Terraform with S3 state and native lock file
        working-directory: terraform/environments/dev
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=${TF_VAR_aws_account_id}/${TF_VAR_environment}/terraform.tfstate"
          -backend-config="region=${TF_VAR_aws_region}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"

      - name: Download saved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform/environments/dev

      - name: Apply saved plan
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -lock-timeout=5m tfplan
